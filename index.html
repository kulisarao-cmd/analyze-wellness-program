            });
          }
          return avoidances;
        }

        // Calculate 9-Taste counts for an array of ingredients
        function calculateTasteCounts(ingredientsList = []) {
          const counts = {
            astringent: 0,
            sweet: 0,
            nutty_fatty: 0,
            salty: 0,
            sour: 0,
            bitter: 0,
            bland: 0,
            cool: 0,
            pungent_hot: 0
          };

          ingredientsList.forEach(ing => {
            if (!ing || !Array.isArray(ing.tastes)) return;
            ing.tastes.forEach(t => {
              const norm = normalizeTasteKey(t);
              if (counts[norm] !== undefined) {
                counts[norm]++;
              }
            });
          });

          return counts;
        }

        // Validate Food Plan against Pedagogical Rules & Deductions
        function validateFoodPlan(selectedIngredients = [], clientContext = {}) {
          const {
            primaryDesignElement = 'fire',
            season = 'summer',
            hasDiabetes = false,
            hasPhlegm = false,
            diseaseText = '',
            seasonText = ''
          } = clientContext;

          const warnings = [];
          let totalDeduction = 0;

          // Target Tastes Union = Base Element Tastes ∪ Seasonal Adjusted Tastes
          const baseTastes = (BASE_ELEMENT_TASTES[primaryDesignElement] || []).map(normalizeTasteKey);
          const seasonalInfo = getSeasonalTasteAdjustments(season || seasonText);
          const seasonalTastes = (seasonalInfo.addedTastes || []).map(normalizeTasteKey);
          const validTargetTastes = new Set([...baseTastes, ...seasonalTastes]);

          // 1. Non-target Ingredient Evaluation (-5 per item)
          let nonTargetCount = 0;
          selectedIngredients.forEach(ing => {
            const ingTastes = (ing.tastes || []).map(normalizeTasteKey);
            const isTarget = ingTastes.some(t => validTargetTastes.has(t));
            if (!isTarget) {
              nonTargetCount++;
            }
          });

          if (nonTargetCount > 0) {
            const deduction = nonTargetCount * 5;
            totalDeduction += deduction;
            const primaryMeta = getElementMeta(primaryDesignElement);
            warnings.push({
              id: 'non-target-ingredient',
              code: 'NON_TARGET_INGREDIENT',
              severity: 'warning',
              title: `⚠️ พบวัตถุดิบไม่ตรงกับรสประจำธาตุหรือฤดูกาล (${nonTargetCount} รายการ)`,
              deduction: deduction,
              message: `มี ${nonTargetCount} วัตถุดิบที่ให้รสไม่ตรงกับรสยาหลักของ ${primaryMeta.nameTh} (${baseTastes.map(t => getTasteMeta(t).nameTh).join(', ')}) หรือรสเสริมฤดูกาล (${seasonalInfo.addedTasteNames.join(', ')}) ทำให้ประสิทธิภาพการปรับสมดุลลดลง (หักคะแนน -${deduction} คะแนน)`
            });
          }

          // 2. Rule: Diabetes + Sweet (-8 points)
          const isDiabetesClient = hasDiabetes || diseaseText.includes('เบาหวาน') || diseaseText.includes('diabetes');
          const sweetIngredients = selectedIngredients.filter(ing => 
            (ing.tastes || []).map(normalizeTasteKey).includes('sweet')
          );

          if (isDiabetesClient && sweetIngredients.length > 0) {
            totalDeduction += 8;
            warnings.push({
              id: 'diabetes-sweet-violation',
              code: 'FOOD_DIABETES_SWEET',
              severity: 'danger',
              title: '⛔ ข้อควรระวัง: วัตถุดิบรสหวานขัดกับภาวะโรคเบาหวาน (FOOD_DIABETES_SWEET)',
              deduction: 8,
              message: `ผู้รับบริการมีภาวะโรคเบาหวาน แต่มีการเลือกวัตถุดิบรสหวาน (${sweetIngredients.map(i => i.nameTh).join(', ')}) ซึ่งอาจส่งผลให้ระดับน้ำตาลในเลือดสูงขึ้น ควรปรับเปลี่ยนเป็นรสอื่นที่ช่วยปรับธาตุโดยไม่เพิ่มภาระน้ำตาล (หักคะแนน -8 คะแนน)`
            });
          }

          // 3. Rule: Fire Element + Hot Season + HotSpicy Taste (-6 points)
          const isFireElement = primaryDesignElement === 'fire';
          const isHotSeason = seasonalInfo.seasonKey === 'summer' || seasonText.includes('ร้อน') || seasonText.includes('คิมหันต์') || seasonText.includes('summer');
          const hotSpicyIngredients = selectedIngredients.filter(ing => 
            (ing.tastes || []).map(normalizeTasteKey).includes('pungent_hot')
          );

          if (isFireElement && isHotSeason && hotSpicyIngredients.length > 0) {
            totalDeduction += 6;
            warnings.push({
              id: 'fire-hot-season-spicy-violation',
              code: 'FOOD_FIRE_HOT_SEASON_HOTSPICY',
              severity: 'danger',
              title: '⛔ ข้อควรระวัง: รสเผ็ดร้อนในคิมหันตฤดูสำหรับธาตุไฟ (FOOD_FIRE_HOT_SEASON_HOTSPICY)',
              deduction: 6,
              message: `ผู้รับบริการมีธาตุหลักคือธาตุไฟ ในคิมหันตฤดู (ฤดูร้อน) เตโชธาตุกำเริบได้ง่าย การเลือกวัตถุดิบรสเผ็ดร้อน (${hotSpicyIngredients.map(i => i.nameTh).join(', ')}) จะกระตุ้นความร้อนสะสมและการอักเสบในร่างกาย ควรเลือกใช้รสเย็น จืด หรือขมเพื่อดับพิษร้อน (หักคะแนน -6 คะแนน)`
            });
          }

          // 4. Rule: Water Element + Much Phlegm + Cool-Humid/Winter + Cooling/Bland Taste (-6 points)
          const isWaterElement = primaryDesignElement === 'water';
          const hasPhlegmCondition = hasPhlegm || diseaseText.includes('เสมหะ') || diseaseText.includes('phlegm') || diseaseText.includes('เสมหะมาก') || diseaseText.includes('เสมหะเหนียว');
          const isCoolSeason = seasonalInfo.seasonKey === 'cool-humid' || seasonalInfo.seasonKey === 'cold-dry' || seasonText.includes('ฝน') || seasonText.includes('เย็นชื้น') || seasonText.includes('หนาว') || seasonText.includes('วสันต์') || seasonText.includes('เหมันต์');
          const coolBlandIngredients = selectedIngredients.filter(ing => {
            const normTastes = (ing.tastes || []).map(normalizeTasteKey);
            return normTastes.includes('cool') || normTastes.includes('bland');
          });

          if (isWaterElement && hasPhlegmCondition && isCoolSeason && coolBlandIngredients.length > 0) {
            totalDeduction += 6;
            warnings.push({
              id: 'water-phlegm-cool-bland-violation',
              code: 'FOOD_WATER_PHLEGM_COOL_BLAND',
              severity: 'danger',
              title: '⛔ ข้อควรระวัง: รสเย็น/จืดในภาวะเสมหะมากช่วงอากาศเย็นชื้น (FOOD_WATER_PHLEGM_COOL_BLAND)',
              deduction: 6,
              message: `ผู้รับบริการธาตุน้ำที่มีอาการเสมหะมากในช่วงอากาศเย็นชื้น การใช้วัตถุดิบรสเย็นหรือรสจืด (${coolBlandIngredients.map(i => i.nameTh).join(', ')}) จะเพิ่มความชื้นและความเย็นในร่างกาย ทำให้เสมหะสะสมมากขึ้น ควรเลือกใช้รสเปรี้ยว ขม หรือเผ็ดร้อนพอเหมาะ เพื่อกัดและฟอกเสมหะ (หักคะแนน -6 คะแนน)`
            });
          }

          return {
            warnings,
            totalDeduction,
            nonTargetCount,
            isDiabetesSweetViolation: isDiabetesClient && sweetIngredients.length > 0,
            isFireHotSeasonHotSpicyViolation: isFireElement && isHotSeason && hotSpicyIngredients.length > 0,
            isWaterPhlegmCoolBlandViolation: isWaterElement && hasPhlegmCondition && isCoolSeason && coolBlandIngredients.length > 0,
            validTargetTastes: Array.from(validTargetTastes)
          };
        }

        // ==========================================
        // STAGE 5: ACTIVITY & HOLISTIC COVERAGE RULE ENGINE
        // ==========================================

        // Extract client's recorded risk behaviors from intake cards
        function extractClientRiskBehaviors(cards = {}, caseId = '') {
          const behaviorsCard = cards.behaviors || {};
          const diseasesCard = cards.diseases || {};
          const appearanceCard = cards.appearance || {};
          const envCard = cards.seasonAndEnvironment || {};

          const combinedText = [
            behaviorsCard.diet || '',
            behaviorsCard.lifestyle || '',
            behaviorsCard.sleep || '',
            behaviorsCard.routine || '',
            (diseasesCard.conditions || []).join(' '),
            diseasesCard.symptoms || '',
            (appearanceCard.selectedTraits || []).join(' '),
            appearanceCard.narrative || '',
            envCard.environment || '',
            envCard.seasonName || ''
          ].join(' ').toLowerCase();

          const allBehaviors = REFERENCE_DATA.riskBehaviors || [];
          const detected = [];

          // 1. Food (อาหาร)
          if (combinedText.includes('อาหาร') || combinedText.includes('รสจัด') || combinedText.includes('เผ็ดร้อน') || combinedText.includes('กาแฟ') || combinedText.includes('หวาน') || combinedText.includes('ทอด') || combinedText.includes('บุฟเฟต์') || ['case-1', 'case-2', 'case-3', 'case-4'].includes(caseId)) {
            const b = allBehaviors.find(x => x.id === 'food');
            if (b) detected.push(b);
          }

          // 2. Posture (อิริยาบถ)
          if (combinedText.includes('นั่งทำงาน') || combinedText.includes('หน้าจอ') || combinedText.includes('อิริยาบถ') || combinedText.includes('ไม่ค่อยได้ออกกำลังกาย') || combinedText.includes('ขาดการออกกำลังกาย') || combinedText.includes('พับเพียบ') || combinedText.includes('ขัดสมาธิ') || ['case-1', 'case-2', 'case-4'].includes(caseId)) {
            const b = allBehaviors.find(x => x.id === 'posture');
            if (b) detected.push(b);
          }

          // 3. Temperature (ความร้อนและเย็น)
          if (combinedText.includes('ละอองฝน') || combinedText.includes('เย็นชื้น') || combinedText.includes('แอร์สลับ') || combinedText.includes('ร้อนอบอ้าว') || combinedText.includes('หนาว') || ['case-1', 'case-3'].includes(caseId)) {
            const b = allBehaviors.find(x => x.id === 'temperature');
            if (b) detected.push(b);
          }

          // 4. Sleep Deprivation (อดนอน อดข้าว อดน้ำ)
          if (combinedText.includes('นอนดึก') || combinedText.includes('01:00') || combinedText.includes('02:00') || combinedText.includes('ไม่สดชื่น') || combinedText.includes('5–6 ชม') || combinedText.includes('5-6 ชม') || combinedText.includes('พักผ่อนน้อย') || ['case-1', 'case-3', 'case-4'].includes(caseId)) {
            const b = allBehaviors.find(x => x.id === 'sleep_deprivation');
            if (b) detected.push(b);
          }

          // 5. Holding Excretion (กลั้นอุจจาระปัสสาวะ)
          if (combinedText.includes('กลั้น') || combinedText.includes('อุจจาระ') || combinedText.includes('ปัสสาวะ') || combinedText.includes('ท้องผูก') || ['case-2'].includes(caseId)) {
            const b = allBehaviors.find(x => x.id === 'holding_excretion');
            if (b) detected.push(b);
          }

          // 6. Overwork (ทำงานเกินกำลังกาย)
          if (combinedText.includes('เครียดสะสม') || combinedText.includes('งานบริหาร') || combinedText.includes('รับผิดชอบสูง') || combinedText.includes('งานหนัก') || combinedText.includes('เกินกำลัง') || ['case-1', 'case-4'].includes(caseId)) {
            const b = allBehaviors.find(x => x.id === 'overwork');
            if (b) detected.push(b);
          }

          // 7. Sorrow / Grief (ความเศร้าโศกเสียใจ)
          if (combinedText.includes('เศร้า') || combinedText.includes('กังวล') || combinedText.includes('ซึมเศร้า') || combinedText.includes('ทุกข์ใจ')) {
            const b = allBehaviors.find(x => x.id === 'sorrow_grief');
            if (b) detected.push(b);
          }

          // 8. Anger (โทสะ)
          if (combinedText.includes('หงุดหงิดง่าย') || combinedText.includes('ใจร้อน') || combinedText.includes('โมโห') || combinedText.includes('โทสะ') || ['case-1'].includes(caseId)) {
            const b = allBehaviors.find(x => x.id === 'anger');
            if (b) detected.push(b);
          }

          return detected.length > 0 ? detected : (allBehaviors.slice(0, 3));
        }

        // Validate Activity Plan and calculate holistic coverage & deterministic deductions
        function validateActivityPlan(draft, activeCase) {
          const cards = activeCase?.cards || {};
          const birthInfo = cards.birthAndAge || {};
          const appInfo = cards.appearance || {};
          const envInfo = cards.seasonAndEnvironment || {};

          // Resolve Primary Design Element
          let primaryDesignElement = draft?.elementAnalysis?.primaryDesignElement;
          if (!primaryDesignElement) {
            const appTraits = appInfo.selectedTraits || [];
            const appCalc = calculateAppearanceElement(appTraits);
            primaryDesignElement = appCalc.element || getBirthElement(birthInfo.birthMonthNumber || 1);
          }

          const clientAge = Number(birthInfo.age || 38);
          const isOlderAdult = clientAge >= 60;
          const seasonText = String(envInfo.seasonName || envInfo.season || '').toLowerCase();
          const isHotSeason = seasonText.includes('summer') || seasonText.includes('ร้อน') || seasonText.includes('คิมหันต์');
          const isFireHotSeason = primaryDesignElement === 'fire' && isHotSeason;

          // Default 6 schedule periods
          const defaultPeriods = [
            { periodId: 'period-1', periodNumber: 1, timeLabel: '06:00–08:00 น. (ช่วงเช้าตรู่)', activityId: null },
            { periodId: 'period-2', periodNumber: 2, timeLabel: '08:30–11:30 น. (ช่วงเช้าสาย)', activityId: null },
            { periodId: 'period-3', periodNumber: 3, timeLabel: '11:30–13:30 น. (ช่วงเที่ยงวัน)', activityId: null },
            { periodId: 'period-4', periodNumber: 4, timeLabel: '13:30–16:30 น. (ช่วงบ่าย)', activityId: null },
            { periodId: 'period-5', periodNumber: 5, timeLabel: '17:00–19:30 น. (ช่วงเย็น)', activityId: null },
            { periodId: 'period-6', periodNumber: 6, timeLabel: '20:00–22:00 น. (ช่วงค่ำ/ก่อนนอน)', activityId: null }
          ];

          const userPeriods = draft?.activityPlan?.periods || [];
          const periods = defaultPeriods.map((def, idx) => {
            const match = userPeriods.find(p => p.periodId === def.periodId || p.periodNumber === def.periodNumber) || userPeriods[idx];
            return {
              ...def,
              activityId: match?.activityId || null
            };
          });

          // Resolve selected activities
          const allActivities = REFERENCE_DATA.activities || [];
          const selectedActivities = [];
          periods.forEach(p => {
            if (p.activityId) {
              const act = allActivities.find(a => a.id === p.activityId);
              if (act) {
                selectedActivities.push({
                  ...act,
                  periodId: p.periodId,
                  periodNumber: p.periodNumber,
                  timeLabel: p.timeLabel
                });
              }
            }
          });

          const selectedCount = selectedActivities.length;

          // 1. Holistic Coverage (4 Dimensions: กาย, จิต, สังคม, ปัญญา)
          const wellnessCoverage = {
            physical: 0,
            mental: 0,
            social: 0,
            intellectual: 0
          };

          selectedActivities.forEach(act => {
            (act.wellnessDimensions || []).forEach(dim => {
              if (wellnessCoverage[dim] !== undefined) {
                wellnessCoverage[dim]++;
              }
            });
          });

          const missingWellness = [];
          const wellnessAlerts = [];
          if (wellnessCoverage.physical === 0) {
            missingWellness.push('physical');
            wellnessAlerts.push('โปรแกรมยังไม่ครอบคลุมมิติสุขภาวะด้านกาย (Physical)');
          }
          if (wellnessCoverage.mental === 0) {
            missingWellness.push('mental');
            wellnessAlerts.push('โปรแกรมยังไม่ครอบคลุมมิติสุขภาวะด้านจิต (Mental)');
          }
          if (wellnessCoverage.social === 0) {
            missingWellness.push('social');
            wellnessAlerts.push('โปรแกรมยังไม่ครอบคลุมมิติสุขภาวะด้านสังคม (Social)');
          }
          if (wellnessCoverage.intellectual === 0) {
            missingWellness.push('intellectual');
            wellnessAlerts.push('โปรแกรมยังไม่ครอบคลุมมิติสุขภาวะด้านปัญญา (Intellectual)');
          }

          // 2. Dhammanamai Coverage (3 Dimensions: กายานามัย, จิตตานามัย, ชีวิตานามัย)
          const dhammanamaiCoverage = {
            kayanamai: 0,
            jittanamai: 0,
            jivitanamai: 0
          };

          selectedActivities.forEach(act => {
            const key = act.dhammanamaiKey;
            if (dhammanamaiCoverage[key] !== undefined) {
              dhammanamaiCoverage[key]++;
            }
          });

          const missingDhammanamai = [];
          const dhammanamaiAlerts = [];
          if (dhammanamaiCoverage.kayanamai === 0) {
            missingDhammanamai.push('กายานามัย');
            dhammanamaiAlerts.push('โปรแกรมยังไม่ครอบคลุมกายานามัย');
          }
          if (dhammanamaiCoverage.jittanamai === 0) {
            missingDhammanamai.push('จิตตานามัย');
            dhammanamaiAlerts.push('โปรแกรมยังไม่ครอบคลุมจิตตานามัย');
          }
          if (dhammanamaiCoverage.jivitanamai === 0) {
            missingDhammanamai.push('ชีวิตานามัย');
            dhammanamaiAlerts.push('โปรแกรมยังไม่ครอบคลุมชีวิตานามัย');
          }

          // 3. Risk Behavior Correction Engine
          const clientRiskBehaviors = extractClientRiskBehaviors(cards, activeCase?.id || '');
          const behaviorCoverage = [];
          const unaddressedBehaviors = [];
          const warnings = [];
          let totalDeduction = 0;

          clientRiskBehaviors.forEach(behavior => {
            const addressingActs = selectedActivities.filter(act => 
              (behavior.correctiveActivityIds || []).includes(act.id)
            );
            const isAddressed = addressingActs.length > 0;
            behaviorCoverage.push({
              behaviorId: behavior.id,
              behaviorName: behavior.nameTh,
              description: behavior.descriptionTh,
              isAddressed,
              addressingActivities: addressingActs.map(a => a.name)
            });

            if (!isAddressed) {
              unaddressedBehaviors.push(behavior);
              totalDeduction += 4;
              warnings.push({
                id: `warn-behavior-${behavior.id}`,
                code: 'ACTIVITY_RISK_BEHAVIOR_UNADDRESSED',
                category: 'activity',
                severity: 'warning',
                deduction: 4,
                title: `⚠️ พฤติกรรมเสี่ยงยังไม่ได้รับการปรับปรุง: '${behavior.nameTh}' (-4 คะแนน)`,
                message: `พบมูลเหตุแห่งโรคหรือพฤติกรรมเสี่ยง '${behavior.nameTh}' ในข้อมูลประวัติลูกค้า แต่ตารางกิจกรรมทั้ง 6 ช่วงยังไม่มีกิจกรรมที่ช่วยแก้ไขพฤติกรรมนี้ (หักคะแนน -4 คะแนน)`
              });
            }
          });

          // 4. Heating Activity Contraindication Check (Fire + Hot Season + Heating activity = -5 points each)
          const heatingViolations = [];
          if (isFireHotSeason) {
            selectedActivities.forEach(act => {
              if (act.isHeating) {
                heatingViolations.push(act);
                totalDeduction += 5;
                warnings.push({
                  id: `warn-heating-${act.id}-${act.periodNumber}`,
                  code: 'ACTIVITY_FIRE_HOT_SEASON_HEATING',
                  category: 'activity',
                  activityId: act.id,
                  activityName: act.name,
                  periodNumber: act.periodNumber,
                  severity: 'danger',
                  deduction: 5,
                  title: `⛔ ข้อควรระวัง: กิจกรรม '${act.name}' ให้ความร้อน ขัดกับธาตุไฟในคิมหันตฤดู (-5 คะแนน)`,
                  message: `ผู้รับบริการเป็นธาตุไฟและอยู่ในคิมหันตฤดู (ฤดูร้อน) กิจกรรม '${act.name}' (ช่วงที่ ${act.periodNumber}) มีคุณสมบัติให้ความร้อน อาจส่งผลให้เตโชธาตุกำเริบมากขึ้นตามหลักการแพทย์แผนไทย (หักคะแนน -5 คะแนน)`
                });
              }
            });
          }

          // 5. Special Check for Ruesi Dat Ton
          const hasRuesiDatTon = selectedActivities.some(act => act.id === 'act-ruesi-dat-ton');

          return {
            periods,
            selectedActivities,
            selectedCount,
            wellnessCoverage,
            missingWellness,
            wellnessAlerts,
            dhammanamaiCoverage,
            missingDhammanamai,
            dhammanamaiAlerts,
            clientRiskBehaviors,
            behaviorCoverage,
            unaddressedBehaviors,
            hasRuesiDatTon,
            isOlderAdult,
            isFireHotSeason,
            heatingViolations,
            warnings,
            totalDeduction,
            isHolisticComplete: missingWellness.length === 0,
            isDhammanamaiComplete: missingDhammanamai.length === 0
          };
        }

        // Render pure SVG Radar Chart for 4-Dimensional Wellness
        function renderRadarChartSvg(wellnessCoverage) {
          const phys = wellnessCoverage.physical || 0;
          const ment = wellnessCoverage.mental || 0;
          const soc = wellnessCoverage.social || 0;
          const intel = wellnessCoverage.intellectual || 0;

          const maxVal = Math.max(phys, ment, soc, intel, 4);
          const cx = 110;
          const cy = 110;
          const maxR = 75;

          const rPhys = (phys / maxVal) * maxR;
          const rMent = (ment / maxVal) * maxR;
          const rSoc = (soc / maxVal) * maxR;
          const rIntel = (intel / maxVal) * maxR;

          // Vertices: Top (กาย), Right (จิต), Bottom (สังคม), Left (ปัญญา)
          const pPhys = { x: cx, y: cy - rPhys };
          const pMent = { x: cx + rMent, y: cy };
          const pSoc = { x: cx, y: cy + rSoc };
          const pIntel = { x: cx - rIntel, y: cy };

          const polygonPoints = `${pPhys.x},${pPhys.y} ${pMent.x},${pMent.y} ${pSoc.x},${pSoc.y} ${pIntel.x},${pIntel.y}`;

          return `
            <svg viewBox="0 0 220 220" width="200" height="200" style="overflow: visible;" aria-label="แผนภูมิใยแมงมุมแสดงความครอบคลุมสุขภาวะ 4 มิติ">
              <!-- Background Grid Circles / Diamonds -->
              ${[0.25, 0.5, 0.75, 1.0].map(ratio => {
                const r = maxR * ratio;
                return `
                  <polygon points="${cx},${cy - r} ${cx + r},${cy} ${cx},${cy + r} ${cx - r},${cy}" 
                           fill="none" 
                           stroke="#e2e8f0" 
                           stroke-width="1" 
                           stroke-dasharray="${ratio < 1.0 ? '2,2' : 'none'}" />
                `;
              }).join('')}

              <!-- Axis lines -->
              <line x1="${cx}" y1="${cy - maxR}" x2="${cx}" y2="${cy + maxR}" stroke="#cbd5e1" stroke-width="1.2" />
              <line x1="${cx - maxR}" y1="${cy}" x2="${cx + maxR}" y2="${cy}" stroke="#cbd5e1" stroke-width="1.2" />

              <!-- Data Filled Polygon -->
              <polygon points="${polygonPoints}" 
                       fill="rgba(36, 112, 126, 0.25)" 
                       stroke="#24707E" 
                       stroke-width="2.5" />

              <!-- Data Vertex Dots -->
              <circle cx="${pPhys.x}" cy="${pPhys.y}" r="4" fill="#24707E" stroke="#ffffff" stroke-width="1.5" />
              <circle cx="${pMent.x}" cy="${pMent.y}" r="4" fill="#24707E" stroke="#ffffff" stroke-width="1.5" />
              <circle cx="${pSoc.x}" cy="${pSoc.y}" r="4" fill="#24707E" stroke="#ffffff" stroke-width="1.5" />
              <circle cx="${pIntel.x}" cy="${pIntel.y}" r="4" fill="#24707E" stroke="#ffffff" stroke-width="1.5" />

              <!-- Labels -->
              <text x="${cx}" y="${cy - maxR - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">กาย (${phys})</text>
              <text x="${cx + maxR + 10}" y="${cy + 4}" text-anchor="start" font-size="11" font-weight="700" fill="#1e293b">จิต (${ment})</text>
              <text x="${cx}" y="${cy + maxR + 18}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">สังคม (${soc})</text>
              <text x="${cx - maxR - 10}" y="${cy + 4}" text-anchor="end" font-size="11" font-weight="700" fill="#1e293b">ปัญญา (${intel})</text>
            </svg>
          `;
        }

        // Case Validation Utility
        function validateCase(caseObj) {
          if (!caseObj) return { valid: false, reason: 'ไม่พบข้อมูลกรณีศึกษา' };

        }

                      ariaStatus = 'กำลังทำ';

                    return `

                               style="position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;" />
                        <div class="element-choice-radio">
                          <span class="element-choice-radio-dot"></span>

                          ${optDesc ? `<div class="element-choice-desc">${escapeHtml(optDesc)}</div>` : ''}
                        </div>
                      </label>
                    `;
                  }).join('')}
                </div>

                <!-- Validation / Feedback Area -->
                <div id="warmup-feedback-area">
                  ${isAnswered ? (isCorrect ? `
                    <div class="feedback-card feedback-correct">

                      <div class="feedback-body">${escapeHtml(currentQ.explanation || '')}</div>
                    </div>
                  ` : `
                    <div class="feedback-card feedback-incorrect">
                      <div class="feedback-badge badge-incorrect">คำตอบยังไม่ถูกต้อง (ครั้งที่ ${currentAttempts})</div>

                    ${isAnswered && isCorrect ? `
                      ${currentIndex < totalQuestions - 1 ? `

                      ` : `

                          สรุปผลคะแนนวอร์มอัพ →
                        </button>
                      `}
                    ` : `
                      <button type="button" class="btn btn-primary" id="btn-warmup-submit" ${!currentAnswer ? 'disabled' : ''}>
                        ${currentAttempts > 0 ? 'ตรวจคำตอบอีกครั้ง' : 'ตรวจคำตอบ'}
                      </button>
                    `}
                  </div>
                </div>
              </div>
            `;

            // Option selection click handlers
            let selectedOptId = currentAnswer;
            const optionCards = document.querySelectorAll('#warmup-options-group .element-choice-card');
            const submitBtn = document.getElementById('btn-warmup-submit');

            optionCards.forEach(card => {
              const optId = card.getAttribute('data-opt-id');
              const radioInput = card.querySelector('input[type="radio"]');
              const handleSelect = () => {
                if (isAnswered && isCorrect) return; // Locked once answered correctly
                selectedOptId = optId;
                optionCards.forEach(c => {
                  c.classList.remove('is-selected');
                  c.setAttribute('aria-checked', 'false');
                  const r = c.querySelector('input[type="radio"]');
                  if (r) r.checked = false;
                });
                card.classList.add('is-selected');
                card.setAttribute('aria-checked', 'true');
                if (radioInput) radioInput.checked = true;
                if (submitBtn) submitBtn.disabled = false;
              };

              card.addEventListener('click', handleSelect);
              card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  handleSelect();
                }
              });
            });

            // Submit check handler

              submitBtn.addEventListener('click', () => {
                if (!selectedOptId) {
                  AppUI.showToast('กรุณาเลือกคำตอบก่อนตรวจ', 'warning');

                }

                const attempts = (wState.attempts[currentQ.id] || 0) + 1;
                const correct = selectedOptId === currentQ.correctAnswer;
                wState.answers[currentQ.id] = selectedOptId;
                wState.attempts[currentQ.id] = attempts;

                if (correct) {
                  const score = calculateQuestionScore(100, attempts - 1);
                  wState.scores[currentQ.id] = score;

                AppUI.render();

            // Navigation Handlers

                wState.currentIndex = currentIndex - 1;

              backModeBtn.addEventListener('click', () => {

            }

            const nextBtn = document.getElementById('btn-warmup-next');

            const finishBtn = document.getElementById('btn-warmup-finish');

                wState.showSummary = true;
                StorageService.updateDraft(draft.id, { warmupState: wState });

              });

                // Live update logic for custom form
                const monthSelect = document.getElementById('custom-client-month');

                  document.getElementById('badge-count-fire').textContent = `ไฟ: ${res.counts.fire} ข้อ`;

                    const meta = getElementMeta(res.element);
                    resContainer.innerHTML = `ธาตุตามปกติลักษณะ: <strong style="color: ${meta.color};">${meta.nameTh}</strong>`;

                    resContainer.innerHTML = `<span style="color: var(--color-text-muted);">ยังไม่ได้เลือกข้อสังเกต</span>`;

                };

                traitCheckboxes.forEach(cb => cb.addEventListener('change', updateTraitCounts));

                // Form submit handler
                document.getElementById('custom-client-form').addEventListener('submit', (e) => {
                  e.preventDefault();
                  const selectedTraitIds = Array.from(traitCheckboxes).filter(cb => cb.checked).map(cb => cb.value);

                        selectedTraits: selectedTraitIds,

                        traitCounts: calcResult.counts

                      diseases: {
                        symptoms: document.getElementById('custom-client-symptoms').value.trim(),

                            </span>
                          </div>
                          <div class="case-detail-row">
                            <span class="case-detail-label">อาชีพ:</span>
                            <span class="case-detail-value">${escapeHtml(birthInfo.occupation || '-')}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- CARD 2: ลักษณะกายและบุคลิก (ภาคผนวก ข) -->
                  <div class="history-card">
                    <div class="history-card-header">
                      <div class="history-card-title">

                        <div>

                            <span class="case-detail-label">อาหาร/เครื่องดื่มที่ชอบ:</span>
                            <span class="case-detail-value font-semibold">${escapeHtml(behInfo.diet || '-')}</span>
                          </div>
                          <div class="case-detail-row">
                            <span class="case-detail-label">การนอนหลับ:</span>
                            <span class="case-detail-value">${escapeHtml(behInfo.sleep || '-')}</span>
                          </div>
                        </div>
                        <div>
                          <div class="case-detail-row">
                            <span class="case-detail-label">กิจวัตร/ความเครียด:</span>
                            <span class="case-detail-value">${escapeHtml(behInfo.routine || '-')}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- CARD 5: ฤดูกาลและถิ่นที่อยู่ -->
                  <div class="history-card">
                    <div class="history-card-header">
                      <div class="history-card-title">
                        <span>🌦️ การ์ดที่ 5: ฤดูกาลและถิ่นที่อยู่ (Season & Environment)</span>

                      </button>

                             placeholder="🔍 ค้นหากิจกรรม, หมวด 8 อ., หรือธรรมานามัย..." 
                             value="${escapeHtml(modalSearchQuery)}" 
                             style="font-size: 0.875rem; padding: 0.45rem 0.75rem; flex: 1; min-width: 200px;">

                        { id: 'jittanamai', label: `จิตตานามัย (${allActivities.filter(a => a.dhammanamaiKey === 'jittanamai').length})` },
                        { id: 'jivitanamai', label: `ชีวิตานามัย (${allActivities.filter(a => a.dhammanamaiKey === 'jivitanamai').length})` },
                        { id: 'heating', label: `🔥 ให้ความร้อน (${allActivities.filter(a => a.isHeating).length})` },
                        { id: 'non_heating', label: `❄️ ไม่เพิ่มความร้อน (${allActivities.filter(a => !a.isHeating).length})` }

                    </div>

                    <!-- Activities Grid -->
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.75rem; max-height: 440px; overflow-y: auto; padding: 0.25rem;">

                        const isCurrentSlot = period.activityId === act.id;
                        const isHeatingWarn = act.isHeating && isFireHot;

                                <span style="font-size: 0.6875rem; background: ${act.dhammanamaiKey === 'kayanamai' ? '#fef3c7' : act.dhammanamaiKey === 'jittanamai' ? '#e0e7ff' : '#dcfce7'}; color: ${act.dhammanamaiKey === 'kayanamai' ? '#92400e' : act.dhammanamaiKey === 'jittanamai' ? '#3730a3' : '#166534'}; padding: 0.05rem 0.3rem; border-radius: var(--radius-sm); font-weight: 600;">
                                  ${escapeHtml(act.dhammanamaiTh)}
                                </span>
                                ${(act.wellnessDimensionsTh || []).map(dim => `
                                  <span style="font-size: 0.6875rem; background: #f1f5f9; color: #475569; padding: 0.05rem 0.3rem; border-radius: var(--radius-sm);">
                                    ${dim}
                                  </span>
                                `).join('')}
                              </div>

                              <p style="font-size: 0.75rem; color: var(--color-text-muted); line-height: 1.4; margin-bottom: 0.5rem;">
                                ${escapeHtml(act.description || '')}
                              </p>

                              ${isHeatingWarn ? `
                                <div style="font-size: 0.6875rem; background: #ffebee; color: #b71c1c; padding: 0.25rem 0.4rem; border-radius: var(--radius-sm); font-weight: 600; margin-bottom: 0.5rem;">
                                  ⚠️ กิจกรรมนี้ให้ความร้อน (ไม่เหมาะกับธาตุไฟในฤดูร้อน)
                                </div>
                              ` : ''}
                            </div>

                            <div style="display: flex; justify-content: flex-end; padding-top: 0.5rem; border-top: 1px dashed var(--color-border-subtle);">
                              <button type="button" 
                                      class="btn ${isCurrentSlot ? 'btn-secondary' : 'btn-primary'} btn-sm btn-modal-choose-act" 
                                      data-act-id="${act.id}"
                                      style="font-size: 0.75rem; padding: 0.25rem 0.65rem; width: 100%;">
                                ${isCurrentSlot ? '✓ เลือกกิจกรรมนี้อยู่' : 'เลือกกิจกรรมนี้ลงช่วงที่ ' + periodNum}
                              </button>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                </div>
              `;
            };

            const bindActivityEvents = () => {
              // 1. Appendix C modal trigger
              document.getElementById('btn-open-appendix-c-stage5')?.addEventListener('click', () => {
                AppUI.showAppendixCModal();
              });

              // 2. Clear all schedule
              document.getElementById('btn-clear-activity-schedule')?.addEventListener('click', () => {
                AppUI.showConfirmModal(
                  'ล้างตารางกิจกรรม',
                  'คุณต้องการล้างกิจกรรมที่จัดไว้ทั้ง 6 ช่วงเวลาหรือไม่?',
                  'ล้างตาราง',
                  () => {
                    draft.activityPlan.periods.forEach(p => p.activityId = null);
                    syncDraftActivityState();
                    renderActivityUI();
                    AppUI.showToast('ล้างตารางกิจกรรมเรียบร้อยแล้ว', 'info');
                  }
                );
              });

              // 3. Open Selector Modal on Period Slot
              document.querySelectorAll('.btn-select-period-act, .btn-change-period-act').forEach(btn => {
                btn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  const periodId = btn.getAttribute('data-period-id');
                  activePeriodForModal = draft.activityPlan.periods.find(p => p.periodId === periodId);
                  modalSearchQuery = '';
                  modalCategoryFilter = 'all';
                  renderActivityUI();
                });
              });

              // 4. Remove Period Activity
              document.querySelectorAll('.btn-remove-period-act').forEach(btn => {
                btn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  const periodId = btn.getAttribute('data-period-id');
                  const p = draft.activityPlan.periods.find(x => x.periodId === periodId);
                  if (p) {
                    p.activityId = null;
                    syncDraftActivityState();
                    renderActivityUI();
                    AppUI.showToast('นำกิจกรรมออกจากช่วงเวลานี้แล้ว', 'info');
                  }
                });
              });

              // 5. Modal Close button
              document.getElementById('btn-close-act-modal')?.addEventListener('click', () => {
                activePeriodForModal = null;
                renderActivityUI();
              });

              // 6. Modal Filter buttons
              document.querySelectorAll('.btn-act-modal-filter').forEach(btn => {
                btn.addEventListener('click', () => {
                  modalCategoryFilter = btn.getAttribute('data-cat-id');
                  renderActivityUI();
                });
              });

              // 7. Modal Search Input
              const modalSearch = document.getElementById('act-search-input');
              if (modalSearch) {
                modalSearch.addEventListener('input', (e) => {
                  modalSearchQuery = e.target.value;
                  renderActivityUI();
                  const newSearch = document.getElementById('act-search-input');
                  if (newSearch) {
                    newSearch.focus();
                    newSearch.setSelectionRange(newSearch.value.length, newSearch.value.length);
                  }
                });
              }

              // 8. Modal Choose Activity button / Card Click
              document.querySelectorAll('.modal-act-card').forEach(card => {
                card.addEventListener('click', (e) => {
                  const actId = card.getAttribute('data-act-id');
                  selectActivityForPeriod(actId);
                });
              });

              // 9. Notes live update
              const notesInput = document.getElementById('activity-notes-input');
              if (notesInput) {
                notesInput.addEventListener('input', () => {
                  draft.activityPlan.notes = notesInput.value;
                  StorageService.updateDraft(draft.id, { activityPlan: draft.activityPlan });
                });
              }

              // 10. Back button
              document.getElementById('btn-activity-back-food')?.addEventListener('click', () => {
                syncDraftActivityState();
                AppState.setScreen('food-design');
              });

              // 11. Save draft button
              document.getElementById('btn-activity-save-draft')?.addEventListener('click', () => {
                syncDraftActivityState();
                AppUI.showToast('บันทึกแบบร่างตารางกิจกรรมเรียบร้อยแล้ว', 'success');
              });

              // 12. Next button to Stage 6 (Evaluation)
              document.getElementById('btn-activity-next-eval')?.addEventListener('click', () => {
                const val = validateActivityPlan(draft, activeCase);
                if (val.selectedCount === 0) {
                  AppUI.showToast('กรุณาเลือกกิจกรรมอย่างน้อย 1 ช่วงเวลาก่อนดำเนินการต่อ', 'warning');
                  return;
                }
                syncDraftActivityState();
                AppUI.showToast('บันทึกแผนกิจกรรมเรียบร้อยแล้ว ดำเนินการต่อสู่ด่านที่ 6 การประเมินผล', 'success');
                AppState.setScreen('evaluation');
              });
            };

            const selectActivityForPeriod = (actId) => {
              if (activePeriodForModal) {
                const target = draft.activityPlan.periods.find(p => p.periodId === activePeriodForModal.periodId);
                if (target) {
                  target.activityId = actId;
                }
                activePeriodForModal = null;
                syncDraftActivityState();
                renderActivityUI();
                AppUI.showToast('บันทึกกิจกรรมลงช่วงเวลาเรียบร้อยแล้ว', 'success');
              }
            };

            const syncDraftActivityState = () => {
              draft.activityPlan.notes = document.getElementById('activity-notes-input')?.value || draft.activityPlan.notes || '';
              draft.activityPlan.updatedAt = new Date().toISOString();
              StorageService.updateDraft(draft.id, { activityPlan: draft.activityPlan });
            };

            // Initial render of Stage 5 UI
            renderActivityUI();
          },

          // SCREEN 4-9: Six-Stage Working Shells
          renderStagePlaceholder: function (stageNumber) {
            const currentStageObj = STAGES.find(s => s.number === stageNumber) || STAGES[0];
            const draft = AppState.activeDraft;
            const modeText = draft?.caseMode === 'preset' ? 'เคสสำเร็จรูป' : 'สร้างลูกค้าเอง';

            // Ensure active draft reflects stage
            if (draft && draft.currentStage !== stageNumber) {
              StorageService.updateDraft(draft.id, { currentStage: stageNumber });
              draft.currentStage = stageNumber;
            }

            this.container.innerHTML = `
              ${this.renderProgress(stageNumber)}

              <div class="card">
                <div class="card-header">
                  <div>
                    <span class="placeholder-tag">ด่านที่ ${stageNumber} จาก 6</span>
                    <h2>${currentStageObj.title}</h2>
                    <p style="font-size: 0.875rem; color: var(--color-text-muted); margin-top: 0.25rem;">
                      ผู้ฝึก: <strong>${escapeHtml(AppState.student.name || 'นักศึกษา')}</strong> | โหมด: ${modeText}
                    </p>
                  </div>
                </div>

                <div class="placeholder-stage">
                  <div class="placeholder-icon">
                    <span>${stageNumber === 1 ? '🎯' : stageNumber === 2 ? '📑' : stageNumber === 3 ? '⚖️' : stageNumber === 4 ? '🍲' : stageNumber === 5 ? '🧘' : '📊'}</span>
                  </div>
                  <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">ส่วนนี้จะพร้อมในขั้นถัดไป (Milestone ${stageNumber + 1})</h3>
                  <p style="color: var(--color-text-muted); max-width: 520px; margin: 0 auto 1.5rem; font-size: 0.9375rem;">
                    โครงสร้างระบบ เส้นทาง Navigation และ localStorage Data Model สำหรับด่านนี้ได้รับการตั้งค่าพร้อมสมบูรณ์แล้ว เนื้อหาแบบจำลองเชิงลึกจะถูกบรรจุใน Milestone ถัดไป
                  </p>

                  <div class="callout callout-info" style="text-align: left; max-width: 540px; margin: 0 auto 1.5rem;">
                    <strong>ขอบเขตของด่านนี้ที่จะทำงานในระบบจริง:</strong>
                    <ul style="padding-left: 1.2rem; margin-top: 0.35rem; font-size: 0.875rem; line-height: 1.6;">
                      ${stageNumber === 1 ? `
                        <li>คำถามวอร์มอัพวัดความรู้เรื่องธาตุกำเนิดและรสยาประจำธาตุ</li>
                        <li>ระบบ Feedback อธิบายหลักการเบื้องต้น</li>
                      ` : stageNumber === 2 ? `
                        <li>การเปิดการ์ดข้อมูลลูกค้า 5 ด้าน (เดือนเกิด, ปกติลักษณะ, โรคประจำตัว, พฤติกรรม, ฤดูกาล)</li>
                        <li>บันทึกประเด็นที่พบและความขัดแย้งของข้อมูล</li>
                      ` : stageNumber === 3 ? `
                        <li>วิเคราะห์ธาตุกำเนิดเทียบกับธาตุตามปกติลักษณะ</li>
                        <li>ระบบบังคับเขียนเหตุผลอย่างน้อย 60 ตัวอักษรเมื่อธาตุสองวิธีไม่ตรงกัน</li>
                      ` : stageNumber === 4 ? `
                        <li>เลือกวัตถุดิบ 6 รายการ และคำนวณสมดุลรส 9 รส</li>
                        <li>Rule engine ตรวจสอบข้อห้ามของโรคและฤดูกาล</li>
                      ` : stageNumber === 5 ? `
                        <li>จัดกิจกรรมลง 6 ช่วงเวลา ตรวจสอบความครอบคลุมสุขภาวะ 4 มิติ และธรรมานามัย</li>
                        <li>คำนวณข้อควรระวังท่าฤๅษีดัดตนและปรับความหนักตามอายุ</li>
                      ` : `
                        <li>คำนวณคะแนนเต็ม 100 และแสดงธงเตือน (Warning flags) พร้อมเหตุผล</li>
                        <li>จำลองการติดตามผล 30/60/90 วัน และเปิดให้แก้ไขโปรแกรมรอบสอง</li>
                      `}
                    </ul>

                    </button>

                    ${stageNumber < 6 ? `

                        จำลองบันทึกผลงานลงประวัติ
                      </button>
                    `}
                  </div>
                </div>
              </div>
            `;

            const prevBtn = document.getElementById('btn-prev-stage');
            if (prevBtn && stageNumber > 1) {

                AppState.setScreen(prevStageObj.id);

              finishBtn.addEventListener('click', () => {

                );
              });

          },

          // SCREEN 10: Records Screen
          renderRecords: function () {
            const submissions = StorageService.listSubmissions();

                    </p>
                  </div>
                  <div style="display: flex; gap: 0.5rem;">
                    ${submissions.length > 0 ? `
                      <button type="button" class="btn btn-secondary btn-sm" id="btn-clear-records" style="color: var(--color-danger);">

                      </button>
                    ` : ''}
                    <button type="button" class="btn btn-primary btn-sm" id="btn-back-home">

                      เมื่อคุณทำแบบฝึกหัดจนถึงขั้นตอนประเมินและกดส่งงาน ผลงาน คะแนน และรายงานสะท้อนคิดจะปรากฏที่นี่
                    </p>
                    <button type="button" class="btn btn-primary" id="btn-empty-start">
                      เริ่มฝึกออกแบบโปรแกรม

                ` : `

                      <tbody>

                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'

                          return `
                            <tr>
                              <td style="white-space: nowrap;">${dateStr}</td>
                              <td>
                                <strong>${escapeHtml(sub.student?.name || '-')}</strong>
                                <div style="font-size: 0.75rem; color: var(--color-text-muted);">${escapeHtml(sub.student?.studentId || '-')}</div>

                              <td>${escapeHtml(sub.caseTitle || sub.caseMode || '-')}</td>
                              <td>${escapeHtml(sub.primaryElement || '-')}</td>
                              <td>
                                <strong style="color: ${sub.score >= 80 ? 'var(--color-success)' : sub.score >= 60 ? 'var(--color-warning)' : 'var(--color-danger)'};">

                      </tbody>
                    </table>
                  </div>
                `}
              </div>
            `;

            // Bind actions
            document.getElementById('btn-back-home').addEventListener('click', () => {
              AppState.setScreen('welcome');
            });

            const emptyStartBtn = document.getElementById('btn-empty-start');
            if (emptyStartBtn) {
              emptyStartBtn.addEventListener('click', () => {
                AppState.setScreen(AppState.student.name ? 'mode' : 'student');
              });
            }

            const clearBtn = document.getElementById('btn-clear-records');
            if (clearBtn) {
              clearBtn.addEventListener('click', () => {
                AppUI.showConfirmModal(
                  'ยืนยันการล้างประวัติ',
                  'คุณต้องการลบประวัติการส่งงานทั้งหมดในเบราว์เซอร์นี้หรือไม่? การกระทำนี้ไม่สามารถย้อนคืนได้',
                  'ลบข้อมูลทั้งหมด',
                  () => {
                    StorageService.clearAllSubmissions();
                    AppUI.showToast('ล้างประวัติการส่งงานเรียบร้อยแล้ว', 'info');
                    AppUI.render();
                  }
                );
              });
            }
          }
        };

        // Initialize on DOM Ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => AppUI.init());
        } else {
          AppUI.init();
        }

        // Export debug hook for developer validation (console)
        window.__RUEN_THAT__ = {
          AppState,
          StorageService,
          REFERENCE_DATA,
          AppUI
        };
      })();
    </script>
  </body>
</html>
